<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Knowledge Base Copilot</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea,input{width:100%;padding:.5rem;margin:.2rem 0}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📚 Knowledge Base Copilot</h1><p>Paste KB articles, then ask a question — answers with citations.</p><textarea id="kb" rows="4" placeholder="Paste 2-3 KB article snippets..."></textarea><input id="q" placeholder="Your question"><button onclick="go()">Ask</button><div id="out"></div><script>function go(){const kb=document.getElementById('kb').value,q=document.getElementById('q').value.toLowerCase();const arts=kb.split(/\n\n+/).filter(Boolean);let best=-1,bs=0;arts.forEach((a,i)=>{const s=q.split(/\s+/).filter(w=>w.length>3&&a.toLowerCase().includes(w)).length;if(s>bs){bs=s;best=i}});document.getElementById('out').textContent=best>=0&&bs>0?`Answer grounded in Article ${best+1} [citation]:\n${arts[best].slice(0,300)}...\n\nConfidence: ${Math.min(95,60+bs*10)}%`:'No matching article found — this is a knowledge gap. Consider drafting a new article.\n\nDeploy on your real KB: commercial@ziontechgroup.com'}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/knowledge-base-copilot">GitHub</a> · <a href="https://ziontechgroup.com/rag-forge/">RAG Forge</a></p></body></html>
